# docker compose up -d --build. Settings and secrets come from .env (copy .env.example); none are in the image.
services:
  demo-agent:
    build: .
    image: demo-agent:local
    env_file: .env
    # set here only (not in the Dockerfile): `environment` wins over env_file, while env_file would override an image ENV.
    # Inside the container it must listen on all interfaces, and data lives on the volume.
    environment:
      DEMO_HOST: 0.0.0.0
      DEMO_PORT: "8787"
      DEMO_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - demo-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    # On 0.0.0.0 the box refuses to start without DEMO_TRUSTED_PROXY. Put it on the named network below, whose gateway
    # is pinned. Proxy on the host: its connections arrive from the gateway, so set DEMO_TRUSTED_PROXY=172.30.0.1.
    # Proxy in another container: give that service `networks: { edge: { ipv4_address: 172.30.0.2 } }` and set
    # DEMO_TRUSTED_PROXY=172.30.0.2. Either way set DEMO_TRUST_LOCAL_HEADER to the header the proxy sets.
    # networks:
    #   edge:
    #     ipv4_address: 172.30.0.10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  demo-data:

