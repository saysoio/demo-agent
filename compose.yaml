# docker compose up -d --build. Settings and secrets come from .env (copy .env.example); none are in the image.
services:
  demo-agent:
    build: .
    image: demo-agent:local
    env_file: .env
    # set here only (not in the Dockerfile): `environment` wins over env_file, while env_file would override an image ENV.
    # Inside the container it must listen on all interfaces, and data lives on the volume.
    environment:
      DEMO_HOST: 0.0.0.0
      DEMO_PORT: "8787"
      DEMO_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - demo-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    # On 0.0.0.0 the box refuses to start without DEMO_TRUSTED_PROXY. The default network below has a pinned gateway.
    # Proxy on the host (deploy/Caddyfile): its connections arrive from the gateway, so set DEMO_TRUSTED_PROXY=172.30.0.1.
    # Proxy in another container: give that service `networks: { default: { ipv4_address: 172.30.0.2 } }` and set
    # DEMO_TRUSTED_PROXY=172.30.0.2. Either way set DEMO_TRUST_LOCAL_HEADER to the header the proxy sets.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Optional, for an Outline (Shadowsocks) access key: `docker compose --profile outline up -d --build`, with
  # DEMO_LLM_PROXY=http://outline:1080 in .env and the key in outline.env. Only the model's calls use it. The key stays
  # in this container; the port is not published, so only services on this compose network reach it.
  outline:
    profiles: [outline]
    image: ghcr.io/shadowsocks/sslocal-rust:v1.25.0
    env_file: outline.env
    command: ["sh", "-c", "exec sslocal --log-without-time --server-url \"$$OUTLINE_KEY\" --local-addr 0.0.0.0:1080 --protocol http"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 32
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  demo-data:

# Every service joins this network (the outline profile too), so the gateway a proxy on the host connects from is fixed.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
